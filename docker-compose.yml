services:
  postgres:
    image: postgres:17-alpine
    container_name: ambs-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env.postgres
    environment:
      POSTGRES_DB: ambs
      POSTGRES_USER: ambs
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ambs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambs -d ambs"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ambs_postgres_data:
